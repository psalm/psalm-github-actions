name: Watch

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Psalm version to (re)build, e.g. 6.20.0 or 7.0.0-rc27 (defaults to the latest stable release and the newest prerelease)'
        required: false
        default: ''
  schedule:
    - cron: '30 */4 * * *'
  push:
    branches:
      - master

jobs:
  docker:
    name: Push tagged docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Find Psalm versions
        id: version
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          # the latest stable release, plus the newest alpha/beta/rc when it's newer
          read -r latest prerelease <<EOF
          $(curl -sf 'https://repo.packagist.org/p2/vimeo/psalm.json' | jq -r '.packages["vimeo/psalm"][].version' | php -r '
              $all = array_filter(array_map("trim", file("php://stdin")), fn($v) => preg_match("/^\d+\.\d+\.\d+(-(alpha|beta|rc)\d+)?$/", $v));
              usort($all, "version_compare");
              $stable = array_values(array_filter($all, fn($v) => !str_contains($v, "-")));
              $latest = end($stable);
              $newest = end($all);
              echo $latest, " ", $newest !== $latest && version_compare($newest, $latest, ">") ? $newest : "", "\n";
          ')
          EOF
          if ! echo "$latest" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Could not determine the latest Psalm version from Packagist (got '$latest')"
            exit 1
          fi
          echo "Latest Psalm version is $latest${prerelease:+, latest prerelease is $prerelease}"

          if [ -n "$REQUESTED" ]; then
            if ! echo "$REQUESTED" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)[0-9]+)?$'; then
              echo "::error::Invalid Psalm version '$REQUESTED'"
              exit 1
            fi
            candidates=$REQUESTED
          else
            candidates="$latest $prerelease"
          fi

          versions=""
          for version in $candidates; do
            if ! docker manifest inspect "ghcr.io/psalm/psalm:$version" > /dev/null 2>&1; then
              if [ -n "$REQUESTED" ]; then
                echo "::error::Base image ghcr.io/psalm/psalm:$version does not exist"
                exit 1
              fi
              echo "::warning::Base image ghcr.io/psalm/psalm:$version is not published yet, skipping"
              continue
            fi
            versions="$versions $version"
          done

          echo "Building Psalm$versions"
          echo "versions=$versions" >> $GITHUB_OUTPUT
          echo "latest=$latest" >> $GITHUB_OUTPUT

      - name: Docker login
        if: steps.version.outputs.versions
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, check and publish images
        if: steps.version.outputs.versions
        env:
          VERSIONS: ${{ steps.version.outputs.versions }}
          LATEST: ${{ steps.version.outputs.latest }}
        run: |
          for version in $VERSIONS; do
            image=ghcr.io/psalm/psalm-github-actions:$version
            docker build --pull --build-arg PSALM_VERSION=$version -t $image .

            actual=$(docker run --rm --entrypoint /composer/vendor/bin/psalm $image --version)
            echo "$actual"
            case "$actual" in
              "Psalm $version@"*) ;;
              *)
                echo "::error::Image tagged $version contains '$actual'"
                exit 1
                ;;
            esac

            docker push $image
            # prereleases never become latest
            if [ "$version" = "$LATEST" ]; then
              docker tag $image ghcr.io/psalm/psalm-github-actions:latest
              docker push ghcr.io/psalm/psalm-github-actions:latest
            fi
          done

  workflow-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1.2.1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
